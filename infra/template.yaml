AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Cedar Sentinel — Phase 2 Infrastructure
  EventBridge EventBus, SQS Queue, EventBridge Rule, Scoped IAM Role,
  Lambda Reasoning Processor, and DynamoDB Results Table.

Parameters:
  EventBusName:
    Type: String
    Default: cedar-sentinel-events
    Description: Name of the EventBridge custom event bus for Cedar Sentinel

  DynamoDBTableName:
    Type: String
    Default: cedar-sentinel-results
    Description: Name of the DynamoDB table used as the async results return path

  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    Description: Bedrock cross-region inference profile ID for the reasoning call (Nova Lite APAC)

  CloudWatchLogGroupName:
    Type: String
    Default: /cedar-sentinel/cloudtrail
    Description: CloudWatch Log Group name containing CloudTrail logs for CWL Insights queries

  AVPPolicyStoreSSMParam:
    Type: String
    Default: /cedar-sentinel/dev/avp-policy-store-id
    Description: SSM Parameter path where the disposable AVP policy store ID is persisted

Resources:
  # ─────────────────────────────────────────────────────────────────
  # 1. Custom EventBridge Event Bus
  # ─────────────────────────────────────────────────────────────────
  CedarSentinelEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref EventBusName

  # ─────────────────────────────────────────────────────────────────
  # 2. SQS Queue for Ingesting Terraform Plan Events
  # ─────────────────────────────────────────────────────────────────
  CedarSentinelQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cedar-sentinel-pipeline-queue
      VisibilityTimeout: 180
      MessageRetentionPeriod: 86400

  # ─────────────────────────────────────────────────────────────────
  # 3. SQS Queue Policy granting EventBridge permission to send messages
  # ─────────────────────────────────────────────────────────────────
  CedarSentinelQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CedarSentinelQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToSendMessages
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CedarSentinelQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt CedarSentinelRule.Arn

  # ─────────────────────────────────────────────────────────────────
  # 4. EventBridge Rule routing events to SQS Queue
  # ─────────────────────────────────────────────────────────────────
  CedarSentinelRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cedar-sentinel-plan-analysis-rule
      Description: Routes Terraform plan analysis events to the SQS processing queue
      EventBusName: !Ref CedarSentinelEventBus
      EventPattern:
        source:
          - cedar.sentinel.test
          - cedar.sentinel
      State: ENABLED
      Targets:
        - Arn: !GetAtt CedarSentinelQueue.Arn
          Id: CedarSentinelQueueTarget

  # ─────────────────────────────────────────────────────────────────
  # 5. DynamoDB Results Table — async return path (Phase 2 new component)
  #    Keyed by request_id (UUID4 generated by CLI).
  #    TTL field: ttl (Unix timestamp; 72-hour auto-expiry keeps table clean)
  # ─────────────────────────────────────────────────────────────────
  CedarSentinelResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ─────────────────────────────────────────────────────────────────
  # 6. Scoped IAM Execution Role for Lambda Processor
  # ─────────────────────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cedar-sentinel-lambda-exec-${AWS::Region}"
      Description: Scoped execution role for Cedar Sentinel pipeline Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # CloudWatch Logs — Lambda log group write access
        - PolicyName: CedarSentinelLambdaLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cedar-sentinel-pipeline-processor:*"

        # SQS — read from the pipeline queue
        - PolicyName: CedarSentinelLambdaSQSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt CedarSentinelQueue.Arn

        # CloudWatch Logs Insights — query CloudTrail baseline log group
        - PolicyName: CedarSentinelLambdaCWLInsightsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:StopQuery
                  - logs:DescribeLogGroups
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

        # Bedrock — invoke the cross-region inference profile (Nova Lite APAC)
        # Scoped to inference-profile ARN for ap-south-1; the cross-region profile
        # internally delegates to ap-southeast-2, ap-northeast-1, ap-southeast-1,
        # ap-northeast-2, ap-northeast-3 — those are handled by the profile itself.
        - PolicyName: CedarSentinelLambdaBedrockPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  # APAC cross-region inference profile
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-lite-v1:0"
                  # Foundation model ARNs the profile routes to across APAC regions
                  - "arn:aws:bedrock:ap-south-1::foundation-model/amazon.nova-lite-v1:0"
                  - "arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-lite-v1:0"
                  - "arn:aws:bedrock:ap-northeast-1::foundation-model/amazon.nova-lite-v1:0"
                  - "arn:aws:bedrock:ap-northeast-2::foundation-model/amazon.nova-lite-v1:0"
                  - "arn:aws:bedrock:ap-southeast-1::foundation-model/amazon.nova-lite-v1:0"
                  - "arn:aws:bedrock:ap-northeast-3::foundation-model/amazon.nova-lite-v1:0"
              # Fallback: Meta Llama 3 70B (Llama models are first-party on Bedrock; no marketplace sub needed)
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - "arn:aws:bedrock:ap-south-1::foundation-model/meta.llama3-70b-instruct-v1:0"

        # DynamoDB — write results to the results table
        - PolicyName: CedarSentinelLambdaDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt CedarSentinelResultsTable.Arn

        # Amazon Verified Permissions — disposable policy store management only.
        # Resource is * because the disposable store ID is determined at Lambda runtime
        # (created if absent, then its ARN isn't known at deploy time). Actions are scoped
        # to exactly what stage_cedar_validation calls — no wildcards on the action set.
        - PolicyName: CedarSentinelLambdaAVPPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - verifiedpermissions:CreatePolicyStore
                  - verifiedpermissions:GetPolicyStore
                  - verifiedpermissions:ListPolicyStores
                  - verifiedpermissions:PutSchema
                  - verifiedpermissions:CreatePolicy
                  - verifiedpermissions:DeletePolicy
                  - verifiedpermissions:DeletePolicyStore
                Resource: "*"

        # SSM Parameter Store — persist disposable AVP policy store ID
        - PolicyName: CedarSentinelLambdaSSMPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cedar-sentinel/*"

  # ─────────────────────────────────────────────────────────────────
  # 7. Lambda Pipeline Processor Function
  # ─────────────────────────────────────────────────────────────────
  CedarSentinelProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cedar-sentinel-pipeline-processor
      Description: Reasons about IAM policies via CloudWatch, Bedrock, and Cedar/AVP verification
      CodeUri: ../lambda/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          RESULTS_TABLE_NAME: !Ref DynamoDBTableName
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          CLOUDWATCH_LOG_GROUP_NAME: !Ref CloudWatchLogGroupName
          AVP_POLICY_STORE_SSM_PARAM: !Ref AVPPolicyStoreSSMParam
          AVP_REGION: !Ref AWS::Region
          # ARN of this Lambda's own execution role — used by CLI self-analysis guard
          LAMBDA_EXECUTION_ROLE_ARN: !GetAtt LambdaExecutionRole.Arn
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt CedarSentinelQueue.Arn
            BatchSize: 1
            Enabled: true

Outputs:
  EventBusName:
    Description: EventBridge Event Bus Name
    Value: !Ref CedarSentinelEventBus
    Export:
      Name: CedarSentinelEventBusName

  EventBusArn:
    Description: EventBridge Event Bus ARN
    Value: !GetAtt CedarSentinelEventBus.Arn

  SQSQueueUrl:
    Description: SQS Pipeline Queue URL
    Value: !Ref CedarSentinelQueue

  SQSQueueArn:
    Description: SQS Pipeline Queue ARN
    Value: !GetAtt CedarSentinelQueue.Arn

  LambdaFunctionName:
    Description: Lambda Processor Function Name
    Value: !Ref CedarSentinelProcessorFunction

  LambdaFunctionArn:
    Description: Lambda Processor Function ARN
    Value: !GetAtt CedarSentinelProcessorFunction.Arn

  ResultsTableName:
    Description: DynamoDB Results Table Name
    Value: !Ref CedarSentinelResultsTable

  ResultsTableArn:
    Description: DynamoDB Results Table ARN
    Value: !GetAtt CedarSentinelResultsTable.Arn
