# SAM Configuration file for Cedar Sentinel Phase 1 Infrastructure
version = 0.1

[default]
[default.global.parameters]
stack_name = "cedar-sentinel-infra"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
stack_name = "cedar-sentinel-infra"
region = "ap-south-1"
parameter_overrides = "EventBusName=\"cedar-sentinel-events\""
image_repositories = []
